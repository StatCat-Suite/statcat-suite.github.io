[project]
name = "statcat-suite-docs"
version = "0.1.0"
description = "The StatCat Suite docs hub, served at https://statcat-suite.github.io/"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    # The same floor as statcatlib's and sdmxlib's docs builds, so the hub
    # renders with the theme release the project sites use.
    "mkdocs-material>=9.7.6",
]

[tool.uv]
package = false
