# Publish the hub to GitHub Pages at https://statcat-suite.github.io/.
#
# Runs `just ci` (prose check, block check, strict build) and deploys the
# built site. It builds on every push to main that touches what the site is
# made of, and can be run by hand from the Actions tab.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "justfile"
      - "CLAUDE.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but never
# cancels a deployment already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.46.0"
      - run: uv sync --group dev
      - run: just ci
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
